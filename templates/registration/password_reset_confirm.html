{% extends '_layout1.html' %}

{% block content %}
<div class="container mt-4 mb-5">
    <h2>Digite a Nova Senha</h2>
    {% if validlink %}
        <form method="post" style="max-width: 400px;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Alterar Senha</button>
        </form>
    {% else %}
        <div class="alert alert-danger">
            O link de redefinição de senha é inválido ou já expirou. Por favor, solicite um novo link.
        </div>
        <a href="{% url 'password_reset' %}" class="btn btn-primary">Solicitar novo link</a>
    {% endif %}
</div>
{% endblock %}
