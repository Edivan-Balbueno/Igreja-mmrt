{% extends '_layout1.html' %}

{% block content %}
<div class="container mt-4 mb-5">
    <h2>Redefinir Senha</h2>
    <p>Informe o seu e-mail cadastrado abaixo. Enviaremos as instruções para você redefinir sua senha.</p>
    
    <form method="post" class="mt-3" style="max-width: 400px;">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-primary">Enviar link de redefinição</button>
    </form>
</div>
{% endblock %}
